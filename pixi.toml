[workspace]
authors = ["pdimens <pdimens@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Add a short description here"
name = "haplotagging_simulations"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[environments]
default = ["mimick"]
harpy = ["harpy"]
renv = ["renv"]
sniffles = ["sniffles"]

[feature.mimick.dependencies]
python = ">=3.12"
visor = ">=1.1.2.1,<2"
mimick = ">=2.3,<3"
ipython = ">=9.6.0,<10"

[feature.harpy.dependencies]
harpy = ">=2"

[feature.renv.dependencies]
r-dplyr = ">=1.1.4"
r-ggh4x =  ">=0.3.1"
r-ggpubr = ">=0.6.1"
r-ggpattern = ">=1.1.4"
r-irkernel = ">=1.3.2"
r-languageserver = ">=0.3.16"

[feature.sniffles.dependencies]
sniffles = ">=2.7.0"

[dependencies]
python = ">=3.12.12,<3.15"

