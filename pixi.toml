[project]
authors = ["pdimens <pdimens@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Add a short description here"
name = "haplotagging_simulations"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[environments]
default = ["mimick"]
harpy = ["harpy"]
renv = ["renv"]

[feature.mimick.dependencies]
python = ">=3.12"

[feature.harpy.dependencies]
harpy = ">=2"

[feature.renv.dependencies]
r-dplyr = ">=1.1.4"
r-ggpubr = ">=0.6.1"
r-ggpattern = "1.1.4"
r-irkernel = ">=1.3.2"
r-languageserver = ">=0.3.16"
